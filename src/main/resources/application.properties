spring.application.name=ecommerce-multivendor-project
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/easymartdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
server.port=${PORT:5454}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
#app password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
razorpay.api.key=${RAZORPAY_KEY}
razorpay.api.secret=${RAZORPAY_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
# Product image uploads — legacy local-disk path, kept for backward
# compatibility with images uploaded before the Cloudinary switch.
# New uploads go through Cloudinary (see below); this can stay as-is.
app.upload.dir=uploads/products
app.upload.user-dir=uploads/users
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
